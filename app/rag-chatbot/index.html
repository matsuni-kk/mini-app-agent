<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RAG Chatbot - Gemini APIを使用したドキュメント検索チャットボット">
    <title>RAG Chatbot</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <h1 class="header__title">RAG Chatbot</h1>
            <div class="header__info" id="headerInfo">
                <span class="header__phase header__phase--search">検索モード</span>
                <span class="header__status"></span>
            </div>
        </header>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Left Panel: PDF Viewer (Initially Hidden) -->
            <aside class="pdf-panel pdf-panel--hidden" id="pdfPanel">
                <div class="pdf-panel__header">
                    <div class="pdf-panel__nav">
                        <button class="pdf-nav-btn" id="prevPageBtn" title="前のページ">◀</button>
                        <span class="pdf-panel__page-info" id="pageInfo">0 / 0</span>
                        <button class="pdf-nav-btn" id="nextPageBtn" title="次のページ">▶</button>
                    </div>
                    <span class="pdf-panel__title" id="currentFileName"></span>
                    <button class="pdf-panel__close-btn" id="closePanelBtn" title="閉じる">✕</button>
                </div>
                <div class="pdf-panel__viewer" id="pdfViewer">
                    <!-- PDFがここに表示される -->
                </div>
            </aside>

            <!-- Right Panel: Chat (Full Width Initially) -->
            <main class="chat-panel chat-panel--full" id="chatPanel">
                <div class="chat-panel__messages" id="chatArea">
                    <div class="message message--bot">
                        <div class="message__content">こんにちは！事例集の検索・質問ができます。

カテゴリから選ぶか、キーワードで検索してください:</div>
                        <div class="message__actions">
                            <button class="category-btn" data-category="AI推進">AI推進</button>
                            <button class="category-btn" data-category="業務カイゼン">業務カイゼン</button>
                            <button class="category-btn" data-category="データ整形">データ整形</button>
                            <button class="category-btn" data-category="情報検索">情報検索</button>
                            <button class="category-btn" data-category="ドキュメント">ドキュメント</button>
                            <button class="category-btn" data-category="問い合わせ">問い合わせ</button>
                        </div>
                    </div>
                    <div class="message message--bot">
                        <div class="message__content">業界で絞り込む:</div>
                        <div class="message__actions">
                            <button class="category-btn category-btn--secondary" data-category="製造業">製造業</button>
                            <button class="category-btn category-btn--secondary" data-category="物流">物流</button>
                            <button class="category-btn category-btn--secondary" data-category="不動産">不動産</button>
                            <button class="category-btn category-btn--secondary" data-category="建設">建設</button>
                            <button class="category-btn category-btn--secondary" data-category="メディア">メディア</button>
                            <button class="category-btn category-btn--secondary" data-category="自治体">自治体</button>
                        </div>
                    </div>
                </div>
                <footer class="chat-panel__input">
                    <input
                        type="text"
                        class="chat-panel__input-field"
                        id="messageInput"
                        placeholder="キーワードで検索...（例: AI推進、製造業）"
                        aria-label="メッセージ入力"
                    >
                    <button class="btn btn--primary" id="sendBtn" type="button">送信</button>
                </footer>
            </main>
        </div>
    </div>

    <!-- Templates -->
    <template id="userMessageTemplate">
        <div class="message message--user">
            <div class="message__content"></div>
        </div>
    </template>

    <template id="botMessageTemplate">
        <div class="message message--bot">
            <div class="message__content"></div>
            <div class="message__actions"></div>
        </div>
    </template>

    <template id="loadingTemplate">
        <div class="loading" id="loadingIndicator">
            <span class="loading__dot"></span>
            <span class="loading__dot"></span>
            <span class="loading__dot"></span>
        </div>
    </template>

    <script src="js/app.js"></script>
</body>
</html>
